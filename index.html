<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vault — ที่เก็บรหัสผ่านส่วนตัว</title>
<meta name="theme-color" content="#0b0d14">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'">
<style>
:root{
  --bg:#0b0d14;--surface:#141826;--surface2:#1c2236;--line:rgba(255,255,255,.08);
  --text:#eceffb;--muted:#8d95b3;--accent:#7c5cff;--accent2:#22d3ee;--danger:#ff5d73;--ok:#34d399;--warn:#fbbf24;
  --shadow:0 20px 60px rgba(0,0,0,.45);--r:18px;--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,.8,.2,1);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
[data-theme=light]{
  --bg:#f3f4fb;--surface:#ffffff;--surface2:#eef0fa;--line:rgba(20,24,50,.09);
  --text:#161a33;--muted:#667090;--shadow:0 20px 50px rgba(40,50,110,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;transition:background .4s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
svg.i{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* aurora background */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--accent);left:-15vmax;top:-20vmax}
.aurora i:nth-child(2){background:var(--accent2);right:-20vmax;top:10vh;animation-duration:28s;animation-delay:-8s}
.aurora i:nth-child(3){background:#ff4fa3;left:20vw;bottom:-30vmax;animation-duration:34s;animation-delay:-14s;opacity:.18}
[data-theme=light] .aurora i{opacity:.22}
@keyframes drift{to{transform:translate3d(8vw,6vh,0) scale(1.15)}}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:600;position:relative;overflow:hidden;transition:transform .25s var(--spring),background .2s,box-shadow .2s;user-select:none}
.btn:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#5b8cff);color:#fff;box-shadow:0 8px 24px rgba(124,92,255,.4)}
.btn.primary:hover{box-shadow:0 10px 30px rgba(124,92,255,.55);transform:translateY(-1px)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.ghost:hover{background:color-mix(in srgb,var(--surface2) 80%,var(--accent) 20%)}
.btn.danger{background:rgba(255,93,115,.14);color:var(--danger)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--muted);transition:.2s var(--spring)}
.icon-btn:hover{background:var(--surface2);color:var(--text);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.9)}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:600;letter-spacing:.02em}
.inp{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);outline:0;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,92,255,.18)}
textarea.inp{resize:vertical;min-height:90px}
.inp-wrap{position:relative;display:flex;gap:6px;align-items:center}
.inp-wrap .inp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:600;font-size:13.5px;white-space:nowrap;transition:.25s var(--spring);border:1.5px solid transparent}
.chip:hover{color:var(--text);transform:translateY(-1px)}
.chip.on{background:rgba(124,92,255,.18);color:var(--text);border-color:var(--accent)}
.chip small{opacity:.7;font-weight:500}

/* lock screen */
#lock{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:50;transition:opacity .5s var(--ease),transform .6s var(--ease),visibility .6s}
#lock.gone{opacity:0;transform:scale(1.06);visibility:hidden;pointer-events:none}
.lock-card{width:min(420px,100%);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:28px;padding:30px 26px 24px;box-shadow:var(--shadow);animation:pop .7s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.94)}}
.lock-card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.logo{width:86px;height:86px;margin:0 auto 14px;display:block;filter:drop-shadow(0 12px 28px rgba(124,92,255,.55))}
.logo .shackle{transform-origin:62px 46px;transition:transform .5s var(--spring)}
#lock.opening .logo .shackle{transform:translateY(-9px) rotate(-28deg)}
.logo{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.lock-card h1{margin:0;text-align:center;font-size:26px;letter-spacing:.01em}
.lock-card .sub{text-align:center;color:var(--muted);margin:4px 0 22px;font-size:14px}
.tabs{display:flex;gap:6px;background:var(--surface2);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;min-height:38px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--muted);transition:.3s var(--spring)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.meter{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin:-6px 0 12px}
.meter b{display:block;height:100%;width:0;border-radius:9px;transition:width .5s var(--ease),background .3s}
.meter-t{font-size:12px;color:var(--muted);margin:-4px 0 12px;min-height:18px}
.err{color:var(--danger);font-size:13.5px;min-height:20px;margin:0 0 8px;text-align:center}
.linkbtn{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:8px}
.linkbtn:hover{color:var(--text)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:0 0 14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px;flex:none}

/* app shell */
#app{min-height:100%;display:none}
#app.on{display:block;animation:fadeup .6s var(--ease) both}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}}
.top{position:sticky;top:0;z-index:20;padding:calc(12px + var(--safe-t)) 16px 12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:.01em}
.brand svg{width:30px;height:30px}
.search{flex:1;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:42px;border-radius:999px;min-height:44px}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:12px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.sync{display:flex;align-items:center;gap:6px;padding:0 12px;min-height:36px;border-radius:999px;background:var(--surface2);font-size:12.5px;font-weight:600;color:var(--muted)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.sync.busy .dot{background:var(--accent2);animation:blink .8s infinite}
.sync.err .dot{background:var(--danger)}
@keyframes blink{50%{opacity:.25}}
.main{max-width:1100px;margin:0 auto;padding:18px 16px calc(110px + var(--safe-b))}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.filters::-webkit-scrollbar{display:none}
.groups{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.groups .chip{min-height:30px;font-size:12.5px;padding:0 11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 0 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;animation:rise .6s var(--ease) both}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{display:flex;align-items:center;gap:13px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%;position:relative;transition:transform .3s var(--spring),box-shadow .3s,border-color .2s;animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 14px 34px rgba(0,0,0,.25)}
.card:active{transform:scale(.98)}
.av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;font-weight:800;color:#fff;flex:none;box-shadow:inset 0 -8px 16px rgba(0,0,0,.18)}
.card .meta{flex:1;min-width:0}
.card .meta b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa{display:flex;gap:4px}
.qa .icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface2)}
.qa .icon-btn:hover{background:var(--accent);color:#fff}
.star{position:absolute;top:8px;right:10px;color:var(--warn);font-size:12px}
.empty{text-align:center;padding:60px 20px;color:var(--muted);animation:fadeup .6s both}
.empty .big{font-size:60px;display:block;animation:float 3.5s ease-in-out infinite}
.fab{position:fixed;right:max(18px,calc(50vw - 540px));bottom:calc(22px + var(--safe-b));width:62px;height:62px;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;box-shadow:0 14px 34px rgba(124,92,255,.55);z-index:25;transition:transform .35s var(--spring);animation:pop .8s .3s var(--spring) both}
.fab svg{width:28px;height:28px;stroke-width:2.4;transition:transform .35s var(--spring)}
.fab:hover{transform:scale(1.08) rotate(6deg)}
.fab:hover svg{transform:rotate(90deg)}
.fab:active{transform:scale(.9)}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(5,7,14,.6);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:.35s;z-index:60}
#scrim.on{opacity:1;visibility:visible}
#sheet{position:fixed;z-index:61;left:50%;bottom:0;width:min(560px,100%);max-height:92dvh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:28px 28px 0 0;box-shadow:var(--shadow);transform:translate(-50%,105%);transition:transform .5s var(--spring);will-change:transform}
#sheet.on{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;gap:12px;padding:14px 18px 8px;flex:none}
.sheet-h h2{margin:0;font-size:19px;flex:1}
.sheet-b{padding:8px 18px 18px;overflow:auto;overscroll-behavior:contain}
.sheet-f{display:flex;gap:10px;padding:12px 18px calc(14px + var(--safe-b));border-top:1px solid var(--line);flex:none}
.sheet-f .btn{flex:1}
@media(min-width:700px){#sheet{bottom:auto;top:50%;border-radius:28px;transform:translate(-50%,-44%) scale(.92);opacity:0;visibility:hidden;transition:transform .5s var(--spring),opacity .25s,visibility .5s}#sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible}.grab{display:none}}

.kinds{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.sug{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;min-height:42px}
.sug button{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600;white-space:nowrap;transition:.25s var(--spring);animation:pop .4s var(--spring) both}
.sug button:hover{transform:translateY(-2px) scale(1.04)}
.sug .av{width:24px;height:24px;border-radius:8px;font-size:13px}
.frow{display:flex;gap:6px;align-items:flex-end;margin-bottom:12px;animation:rise .35s var(--ease) both}
.frow .lab{width:112px;flex:none}
.frow .lab input{width:100%;min-height:46px;padding:0 4px;background:none;border:0;outline:0;color:var(--muted);font-size:13px;font-weight:600}
.frow .val{flex:1;min-width:0}
.frow .inp{min-height:46px}
.frow .icon-btn{width:40px;height:46px;border-radius:12px;background:var(--surface2)}
.drow{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
.drow:last-of-type{border-bottom:0}
.drow .dv{flex:1;min-width:0}
.drow small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.drow .v{word-break:break-all;font-size:15.5px;white-space:pre-wrap}
.drow .v.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.03em}
.dhead{display:flex;align-items:center;gap:14px;margin:4px 0 8px}
.dhead .av{width:58px;height:58px;font-size:30px;border-radius:18px}
.dhead h3{margin:0;font-size:20px}
.dhead p{margin:0;color:var(--muted);font-size:13px}
.pw-colors span{display:inline-block}
.pw-c-d{color:#ff9db0}.pw-c-n{color:#7dd3fc}.pw-c-s{color:#fcd34d}

/* toast + dialog */
#toasts{position:fixed;left:0;right:0;bottom:calc(100px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:toast .5s var(--spring) both;max-width:92vw}
.toast.out{animation:toastout .3s forwards}
.toast svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .15s forwards}
@keyframes toast{from{opacity:0;transform:translateY(24px) scale(.8)}}
@keyframes toastout{to{opacity:0;transform:translateY(10px) scale(.9)}}
@keyframes draw{to{stroke-dashoffset:0}}
#dlg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(5,7,14,.6);backdrop-filter:blur(5px);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.dlg{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);animation:pop .45s var(--spring) both}
.dlg h3{margin:0 0 6px}.dlg p{margin:0 0 16px;color:var(--muted);font-size:14px;white-space:pre-line}
.dlg .row{display:flex;gap:10px;margin-top:6px}.dlg .row .btn{flex:1}
.set-sec{margin:0 0 22px}
.set-sec h4{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.set-row{display:flex;gap:10px;flex-wrap:wrap}
.set-row .btn{flex:1 1 150px}
.gen-out{font:600 18px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;padding:16px;border-radius:16px;background:var(--surface2);text-align:center;margin-bottom:12px;min-height:62px;display:grid;place-items:center}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.health{display:grid;gap:10px}
.hitem{padding:12px 14px;border-radius:14px;background:var(--surface2);display:flex;gap:10px;align-items:center;font-size:14px}
.hitem b{margin-left:auto}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
@media(max-width:640px){.top-in .brand span,.search kbd{display:none}.sync span{display:none}.sync{padding:0 10px}.frow .lab{width:84px}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   ตั้งค่า Supabase (ไม่บังคับ) — ใส่ค่าตรงนี้ไว้ จะได้ไม่ต้องกรอกใหม่หลังล้างเครื่อง
   anon/publishable key เป็นคีย์สาธารณะ ใส่ในโค้ดได้ (ข้อมูลที่ขึ้นไปเข้ารหัสแล้วเสมอ)
===================================================================== */
const DEFAULT_SUPABASE_URL = '';
const DEFAULT_SUPABASE_KEY = '';

/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const te = new TextEncoder(), td = new TextDecoder();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico = (n, cls='') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const wait = ms => new Promise(r => setTimeout(r, ms));
const lsGet = (k, d=null) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };
const uid = () => { const a = crypto.getRandomValues(new Uint8Array(12)); return [...a].map(b => b.toString(16).padStart(2,'0')).join(''); };
function b64(buf){ const u = new Uint8Array(buf); let s=''; for (let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const bin = atob(s), u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
const hex = u => [...u].map(b => b.toString(16).padStart(2,'0')).join('');
const cat = (...a) => { const o = new Uint8Array(a.reduce((n,x)=>n+x.length,0)); let p=0; for (const x of a){ o.set(x,p); p+=x.length; } return o; };

/* ============================ crypto =============================
   รูปแบบไฟล์ v3 (อ่านได้ด้วย PowerShell / Python):
   key64 = PBKDF2-HMAC-SHA256(NFKC(password), salt, iter) -> 64 ไบต์
   encKey = key64[0..32]  macKey = key64[32..64]
   ct = AES-256-CBC(PKCS7) ; mac = HMAC-SHA256(macKey, iv || ct)
===================================================================== */
const ITER = 600000;
const norm = p => p.normalize('NFKC');
async function deriveKeys(pw, salt, iter){
  const base = await crypto.subtle.importKey('raw', te.encode(norm(pw)), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations: iter, hash:'SHA-256'}, base, 512));
  const enc = await crypto.subtle.importKey('raw', bits.slice(0,32), 'AES-CBC', false, ['encrypt','decrypt']);
  const mac = await crypto.subtle.importKey('raw', bits.slice(32,64), {name:'HMAC', hash:'SHA-256'}, false, ['sign','verify']);
  bits.fill(0);
  return { enc, mac, salt, iter };
}
// id สำหรับซิงค์: คำนวณจากรหัสหลักอย่างเดียว (salt คงที่) เพื่อให้เครื่องใหม่หาข้อมูลเจอ โดยเซิร์ฟเวอร์ไม่รู้รหัส
async function vaultId(pw){
  const base = await crypto.subtle.importKey('raw', te.encode(norm(pw)), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt: te.encode('vault-sync-id-v1'), iterations: 200000, hash:'SHA-256'}, base, 256));
  return hex(bits);
}
async function seal(keys, obj){
  const iv = crypto.getRandomValues(new Uint8Array(16));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-CBC', iv}, keys.enc, te.encode(JSON.stringify(obj))));
  const mac = new Uint8Array(await crypto.subtle.sign('HMAC', keys.mac, cat(iv, ct)));
  return { app:'vault', v:3, kdf:{ alg:'PBKDF2-SHA256', iter: keys.iter, salt: b64(keys.salt) }, iv: b64(iv), ct: b64(ct), mac: b64(mac) };
}
async function unseal(file, keys){
  const iv = unb64(file.iv), ct = unb64(file.ct), mac = unb64(file.mac);
  if (!await crypto.subtle.verify('HMAC', keys.mac, mac, cat(iv, ct))) throw new Error('bad-password');
  return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-CBC', iv}, keys.enc, ct)));
}
const keysFor = (pw, file) => deriveKeys(pw, unb64(file.kdf.salt), file.kdf.iter);
// นำเข้าไฟล์สำรองแบบเก่า (Vault Ledger v2: AES-GCM ต่อรายการ)
async function openLegacy(backup, pw){
  const st = backup.settings;
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt: unb64(st.salt), iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const dec = async (iv, data) => td.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(iv)}, key, unb64(data)));
  if (await dec(st.verifier_iv, st.verifier) !== 'VAULT_OK') throw new Error('bad-password');
  const out = []; let skippedFiles = 0, failed = 0;
  for (const row of backup.items || []){
    try{
      const o = JSON.parse(await dec(row.iv, row.encrypted_data));
      if (o.type === 'file'){ skippedFiles++; continue; }
      const f = [];
      if (o.username) f.push({l:'ชื่อผู้ใช้', v:o.username, s:0});
      if (o.password) f.push({l:'รหัสผ่าน', v:o.password, s:1});
      if (o.note) f.push({l:'โน้ต', v:o.note, s:0, m:1});
      const t = row.created_at ? Date.parse(row.created_at) : Date.now();
      out.push({ id: uid(), k:'login', t: o.platform || 'ไม่มีชื่อ', g: o.category || '', f, fav: o.pinned ? 1 : 0, url:'', c: t, u: t });
    } catch { failed++; }
  }
  return { entries: out, skippedFiles, failed };
}

/* ============================ vault model ============================ */
const KINDS = {
  login:{ n:'บัญชี', e:'🔐', f:[{l:'ชื่อผู้ใช้/อีเมล',s:0},{l:'รหัสผ่าน',s:1}], gen:1 },
  game: { n:'เกม',   e:'🎮', f:[{l:'ชื่อผู้ใช้/อีเมล',s:0},{l:'รหัสผ่าน',s:1}], gen:1 },
  card: { n:'บัตร',  e:'💳', f:[{l:'ชื่อบนบัตร',s:0},{l:'เลขบัตร',s:1},{l:'หมดอายุ',s:0},{l:'CVV',s:1}] },
  wifi: { n:'Wi-Fi', e:'📶', f:[{l:'ชื่อเครือข่าย',s:0},{l:'รหัสผ่าน',s:1}], gen:1 },
  note: { n:'โน้ตลับ',e:'📝', f:[{l:'โน้ต',s:1,m:1}] },
};
const SUGGEST = [
  ['Google','G','#4285f4','login','google.com'],['Facebook','f','#1877f2','login','facebook.com'],['Instagram','📷','#d6249f','login','instagram.com'],
  ['X (Twitter)','𝕏','#111827','login','x.com'],['TikTok','♪','#111827','login','tiktok.com'],['LINE','💬','#06c755','login','line.me'],
  ['Discord','🎧','#5865f2','login','discord.com'],['YouTube','▶','#ff0033','login','youtube.com'],['Netflix','N','#e50914','login','netflix.com'],
  ['GitHub','🐙','#24292f','login','github.com'],['Microsoft','⊞','#0078d4','login','microsoft.com'],['Apple','','#555','login','apple.com'],
  ['Shopee','🛍️','#ee4d2d','login','shopee.co.th'],['Lazada','🛒','#0f146d','login','lazada.co.th'],['Steam','🎮','#1b2838','game','steampowered.com'],
  ['Epic Games','🕹️','#2a2a2a','game','epicgames.com'],['Garena','🔥','#e8590c','game','garena.com'],['Roblox','🧱','#e2231a','game','roblox.com'],
  ['Binance','🪙','#f0b90b','login','binance.com'],['KBank','🏦','#138f2d','login','kasikornbank.com'],['SCB','🏦','#4e2e7f','login','scb.co.th'],['PayPal','💰','#003087','login','paypal.com'],
];
const PALETTE = ['#7c5cff','#22b8cf','#f06595','#fd7e14','#40c057','#4c6ef5','#e64980','#15aabf','#be4bdb','#f59f00','#12b886','#fa5252'];
function look(e){
  const key = e.t.toLowerCase();
  const s = SUGGEST.find(x => { const nm = x[0].toLowerCase().split(' ')[0]; return nm.length < 3 ? (key === nm || key === 'twitter') : key.includes(nm); });
  if (s) return { bg:s[2], ch:s[1] || e.t[0].toUpperCase() };
  let h = 0; for (const c of e.t) h = (h*31 + c.codePointAt(0)) >>> 0;
  return { bg: PALETTE[h % PALETTE.length], ch: e.k === 'login' ? (e.t[0] || '?').toUpperCase() : KINDS[e.k]?.e || '🔑' };
}
const avatar = (e, extra='') => { const a = look(e); return `<div class="av ${extra}" style="background:${a.bg}">${esc(a.ch)}</div>`; };

const S = { keys:null, vault:null, file:null, filter:'all', group:'', q:'', mode:'unlock', pwHold:null, syncId:null, dirty:false, timer:null, pushT:null };
const cfg = { get url(){ return (lsGet('vault.url') ?? DEFAULT_SUPABASE_URL).replace(/\/+$/,''); }, get key(){ return lsGet('vault.key') ?? DEFAULT_SUPABASE_KEY; } };
const pref = { get lock(){ return +lsGet('vault.lockMin','5'); }, get clip(){ return +lsGet('vault.clipSec','30'); }, get glen(){ return +lsGet('vault.glen','16'); } };
const emptyVault = () => ({ v:1, entries:[], del:{}, u:Date.now() });

async function persist(){
  S.vault.u = Date.now();
  S.file = await seal(S.keys, S.vault);
  if (!lsSet('vault.file', JSON.stringify(S.file))) toast('บันทึกในเบราว์เซอร์ไม่ได้ — โปรดส่งออกไฟล์สำรอง');
  S.dirty = true; lsSet('vault.dirty','1');
  schedulePush();
}
function mergeVaults(a, b){
  const del = { ...a.del };
  for (const [k,t] of Object.entries(b.del||{})) del[k] = Math.max(del[k]||0, t);
  const m = new Map();
  for (const e of [...a.entries, ...b.entries]){ const o = m.get(e.id); if (!o || e.u > o.u) m.set(e.id, e); }
  const entries = [...m.values()].filter(e => !(del[e.id] && del[e.id] >= e.u));
  return { v:1, entries, del, u: Math.max(a.u||0, b.u||0, Date.now()) };
}

/* ============================ sync (Supabase REST) ============================ */
const syncOn = () => !!(cfg.url && cfg.key && S.syncId);
function setSync(state, txt){ const c = $('#syncChip'); c.className = 'sync ' + state; $('#syncTxt').textContent = txt; }
function hdr(extra){ return { apikey: cfg.key, Authorization: 'Bearer ' + cfg.key, 'x-vault-id': S.syncId, ...extra }; }
async function remoteGet(){
  const r = await fetch(`${cfg.url}/rest/v1/vault_blobs?id=eq.${S.syncId}&select=data`, { headers: hdr() });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0,140));
  const j = await r.json(); return j[0]?.data || null;
}
async function remotePut(file){
  const r = await fetch(`${cfg.url}/rest/v1/vault_blobs?on_conflict=id`, { method:'POST',
    headers: hdr({'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal'}),
    body: JSON.stringify({ id: S.syncId, data: file, updated_at: new Date().toISOString() }) });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0,140));
}
function schedulePush(){ clearTimeout(S.pushT); if (!syncOn()) { setSync('', 'เฉพาะเครื่องนี้'); return; } setSync('busy','รอซิงค์…'); S.pushT = setTimeout(() => sync(true), 1200); }
let syncing = false;
async function sync(quiet){
  if (!syncOn() || !S.keys || syncing) return; syncing = true;
  setSync('busy', 'กำลังซิงค์…');
  try{
    const remote = await remoteGet();
    if (remote){
      let rv;
      try { rv = await unseal(remote, remote.kdf.salt === S.file.kdf.salt ? S.keys : await keysFor(S.pwHold, remote)); }
      catch { throw new Error('ข้อมูลบนคลาวด์ถอดรหัสไม่ได้ (รหัสหลักไม่ตรง)'); }
      const merged = mergeVaults(S.vault, rv);
      const changed = JSON.stringify(merged.entries.map(e=>e.id+e.u).sort()) !== JSON.stringify(S.vault.entries.map(e=>e.id+e.u).sort());
      S.vault = merged;
      if (changed){ S.file = await seal(S.keys, S.vault); lsSet('vault.file', JSON.stringify(S.file)); render(); }
    }
    await remotePut(S.file);
    S.dirty = false; lsDel('vault.dirty'); lsSet('vault.synced', String(Date.now()));
    setSync('ok', 'ซิงค์แล้ว'); if (!quiet) toast('ซิงค์เรียบร้อย');
  } catch(e){
    setSync('err', navigator.onLine ? 'ซิงค์ผิดพลาด' : 'ออฟไลน์');
    if (!quiet) toast('ซิงค์ไม่สำเร็จ: ' + e.message, 5000);
  } finally { syncing = false; }
}

/* ============================ password tools ============================ */
function strength(p){
  if (!p) return { s:0, t:'' };
  let pool = 0; if (/[a-z]/.test(p)) pool += 26; if (/[A-Z]/.test(p)) pool += 26; if (/\d/.test(p)) pool += 10; if (/[^A-Za-z0-9]/.test(p)) pool += 32;
  let bits = p.length * Math.log2(Math.max(pool,2));
  if (/(.)\1{2,}/.test(p)) bits -= 8; if (/^(?:123|abc|password|qwerty|111)/i.test(p)) bits -= 20;
  const s = Math.max(0, Math.min(100, bits / 80 * 100));
  const t = bits < 36 ? 'อ่อนมาก' : bits < 50 ? 'อ่อน' : bits < 64 ? 'พอใช้' : bits < 80 ? 'ดี' : 'แข็งแรงมาก';
  return { s, t, bits };
}
const sColor = s => s < 35 ? 'var(--danger)' : s < 60 ? 'var(--warn)' : 'var(--ok)';
function randInt(n){ const lim = Math.floor(0x100000000 / n) * n; let x; do { x = crypto.getRandomValues(new Uint32Array(1))[0]; } while (x >= lim); return x % n; }
function genPassword(len=16, o={}){
  const sets = []; const lo='abcdefghijkmnopqrstuvwxyz', up='ABCDEFGHJKLMNPQRSTUVWXYZ', nu='23456789', sy='!@#$%^&*-_=+?';
  if (o.lo !== false) sets.push(lo); if (o.up !== false) sets.push(up); if (o.nu !== false) sets.push(nu); if (o.sy) sets.push(sy);
  if (!sets.length) sets.push(lo);
  const all = sets.join(''); const out = sets.map(s => s[randInt(s.length)]);
  while (out.length < len) out.push(all[randInt(all.length)]);
  for (let i = out.length-1; i > 0; i--){ const j = randInt(i+1); [out[i], out[j]] = [out[j], out[i]]; }
  return out.slice(0, len).join('');
}

/* ============================ import / export ============================ */
function parseCsv(t){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++){ const c = t[i];
    if (q){ if (c === '"'){ if (t[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ',' ){ row.push(cur); cur = ''; }
    else if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; } else if (c !== '\r') cur += c; }
  row.push(cur); rows.push(row); return rows.filter(r => r.some(x => x.trim()));
}
function parseBulk(text){
  const out = [];
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (lines.length && /(^|,)\s*"?(password|รหัส)/i.test(lines[0]) && lines[0].includes(',')){
    const rows = parseCsv(text), h = rows[0].map(x => x.trim().toLowerCase());
    const ix = n => h.findIndex(x => n.some(k => x === k || x.includes(k)));
    const iT = ix(['name','title','ชื่อ']), iU = ix(['username','login_username','user','อีเมล']), iP = ix(['password','login_password','รหัส']), iL = ix(['url','login_uri','website']), iN = ix(['note','notes','โน้ต']);
    for (const r of rows.slice(1)){
      const url = (r[iL] || '').replace(/^https?:\/\//,'').replace(/\/.*$/,'');
      const t = (r[iT] || url || '').trim(); if (!t) continue;
      out.push({ t, user:(r[iU]||'').trim(), pass:r[iP]||'', url, note:(r[iN]||'').trim() });
    }
    return out;
  }
  for (const l of lines){
    const p = l.includes('\t') ? l.split('\t') : l.includes('|') ? l.split('|') : l.split(/\s*[,;]\s*|\s+/);
    if (p.length >= 3) out.push({ t:p[0].trim(), user:p[1].trim(), pass:p.slice(2).join(' ').trim(), url:'', note:'' });
    else if (p.length === 2) out.push({ t:p[0].trim(), user:p[1].trim(), pass:'', url:'', note:'' });
  }
  return out;
}
function addParsed(list){
  let n = 0;
  for (const r of list){
    const dupe = S.vault.entries.some(e => e.t.toLowerCase() === r.t.toLowerCase() && (e.f.find(x=>!x.s)?.v || '') === r.user && (e.f.find(x=>x.s)?.v || '') === r.pass);
    if (dupe) continue;
    const f = []; if (r.user) f.push({l:'ชื่อผู้ใช้/อีเมล', v:r.user, s:0}); if (r.pass) f.push({l:'รหัสผ่าน', v:r.pass, s:1}); if (r.note) f.push({l:'โน้ต', v:r.note, s:0, m:1});

      Object.assign(S, { keys, vault: v, file: remote }); lsSet('vault.file', JSON.stringify(remote)); await enter();
    }
  } catch(e){ fail('เกิดข้อผิดพลาด: ' + e.message); }
  finally { busy = false; btn.disabled = false; btn.textContent = label; }
};

/* ============================ theme / shortcuts / boot ============================ */
function setTheme(t){ document.documentElement.dataset.theme = t; $('#btnTheme').innerHTML = ico(t === 'dark' ? 'sun' : 'moon'); document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0b0d14' : '#f3f4fb'; lsSet('vault.theme', t); }
$('#btnTheme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('#syncChip').onclick = () => { if (!syncOn()) settingsSheet(); else sync(false); };
document.addEventListener('keydown', e => {
  if (!S.keys) return;
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === 'Escape'){ if ($('#dlg')) return; closeSheet(); }
  else if (!typing && e.key === '/'){ e.preventDefault(); $('#q').focus(); }
  else if (!typing && e.key === 'n'){ e.preventDefault(); openEditor(); }
});
setTheme(lsGet('vault.theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
setMode(lsGet('vault.file') ? 'unlock' : 'new');
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
